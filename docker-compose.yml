services:
  postgres:
    image: postgres:17-alpine
    container_name: xiaonuan-postgres
    environment:
      POSTGRES_USER: xiaonuan
      POSTGRES_PASSWORD: xiaonuan
      POSTGRES_DB: xiaonuan
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xiaonuan']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - xiaonuan-network

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: xiaonuan-qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - xiaonuan-network

  redis:
    image: redis:7-alpine
    container_name: xiaonuan-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - xiaonuan-network

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xiaonuan-gateway
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://xiaonuan:xiaonuan@postgres:5432/xiaonuan
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-xiaonuan-prod-secret}
      - WECHAT_APPID=${WECHAT_APPID}
      - WECHAT_SECRET=${WECHAT_SECRET}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - NLS_APP_KEY=${NLS_APP_KEY}
      - NLS_ACCESS_KEY_ID=${NLS_ACCESS_KEY_ID}
      - NLS_ACCESS_KEY_SECRET=${NLS_ACCESS_KEY_SECRET}
    networks:
      - xiaonuan-network

networks:
  xiaonuan-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
