services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: xiaonuan
      POSTGRES_PASSWORD: xiaonuan
      POSTGRES_DB: xiaonuan
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xiaonuan']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  voice-service:
    build:
      context: ./apps/voice-service
      dockerfile: Dockerfile
    restart: always
    environment:
      - BAILIAN_API_KEY=${DASHSCOPE_API_KEY}
      - AUDIO_STORAGE_PATH=/app/data/audio
      - PORT=8000
    volumes:
      - voice-audio:/app/data/audio
    networks:
      - app-network

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      voice-service:
        condition: service_started
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - DATABASE_URL=postgresql://xiaonuan:xiaonuan@postgres:5432/xiaonuan
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - WECHAT_APPID=${WECHAT_APPID}
      - WECHAT_SECRET=${WECHAT_SECRET}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - NLS_APP_KEY=${NLS_APP_KEY}
      - NLS_ACCESS_KEY_ID=${NLS_ACCESS_KEY_ID}
      - NLS_ACCESS_KEY_SECRET=${NLS_ACCESS_KEY_SECRET}
      - VOICE_SERVICE_URL=http://voice-service:8000
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
    networks:
      - app-network

volumes:
  postgres-data:
  qdrant-data:
  redis-data:
  voice-audio:

networks:
  app-network:
    external: true
