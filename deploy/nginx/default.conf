# ==================================================
# Xiaonuan Gateway Configuration
# ==================================================

# --------------------------------------------------
# HTTP Server (Port 80)
# --------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    client_max_body_size 50M;

    # Global Root for Static Files (Verification)
    root /usr/share/nginx/html;

    # Health Check / Root Status
    location / {
        try_files $uri @status;
    }

    location @status {
        add_header Content-Type text/plain;
        return 200 "Xiaonuan Gateway is Running (HTTP)";
    }
}

# --------------------------------------------------
# HTTPS Server (Port 443)
# --------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    client_max_body_size 50M;

    # SSL Certificates
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # SSL Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Global Root for Static Files
    root /usr/share/nginx/html;

    # 1. Domain Verification (.well-known)
    # Priority matching for SSL validation files
    location ^~ /.well-known/ {
        allow all;
        try_files $uri =404;
    }

    # Root Health Check
    location / {
        return 200 "Xiaonuan Gateway is Running (HTTPS)";
    }

    location @status {
        add_header Content-Type text/plain;
        return 200 "Xiaonuan Gateway is Running (HTTPS)";
    }

    # 3. Xiaonuan Gateway API Proxy
    location /xiaonuan/ {
        proxy_pass http://xiaonuan-gateway:3000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
